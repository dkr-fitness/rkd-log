<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Donovan · 8-Week Block + RKD</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1526; --surface:#16203A; --card:#1B2A4A; --line:#2A3A5E;
  --amber:#F5A623; --green:#34C77B; --blue:#5CA8FF; --red:#E05B5B;
  --text:#E9EDF5; --muted:#8A93A6;
  --z1:#6B7A94; --z2:#22D3EE; --z3:#5B7CFA; --z4:#D946EF; --z5:#FF6A00;
  --gold:#F5C242; --silver:#C0C9D6; --bronze:#C98A5A;
  --disp:'Barlow Condensed', system-ui, sans-serif;
  --body:system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:ui-monospace, 'SF Mono', Menlo, monospace;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
body{background:var(--bg); color:var(--text); font-family:var(--body); font-size:15px; padding-bottom:130px}
.topbar{position:sticky; top:0; z-index:20; background:var(--card); border-bottom:2px solid var(--amber); padding:10px 14px; display:flex; align-items:center; justify-content:space-between; gap:8px}
.topbar h1{font-family:var(--disp); font-weight:700; font-size:19px; letter-spacing:.04em; text-transform:uppercase}
.clock{font-family:var(--disp); font-weight:700; font-size:26px; color:var(--amber); min-width:74px; text-align:right; font-variant-numeric:tabular-nums}
.clock.paused{color:var(--muted)}

/* ===== HR / RKD band ===== */
#hrband{position:sticky; top:52px; z-index:19; padding:8px 14px 7px; background:var(--surface); border-bottom:1px solid var(--line); transition:background-color .6s ease}
#hrband.z1{background:linear-gradient(160deg,#2A3550,#1B2338)}
#hrband.z2{background:linear-gradient(160deg,#0A6B80,#083D4A)}
#hrband.z3{background:linear-gradient(160deg,#2B3FB0,#1B2870)}
#hrband.z4{background:linear-gradient(160deg,#8E22A8,#5A1270)}
#hrband.z5{background:linear-gradient(160deg,#C24E00,#8F3400)}
.hb-row{display:flex; align-items:center; gap:12px}
.hb-stat{text-align:center}
.hb-stat .v{font-family:var(--disp); font-weight:700; font-size:24px; line-height:1; font-variant-numeric:tabular-nums}
.hb-stat .l{font-size:9px; text-transform:uppercase; letter-spacing:.12em; color:rgba(255,255,255,.6)}
.hb-zone{flex:1; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:rgba(255,255,255,.85)}
#btnConnect{background:var(--blue); color:#fff; border:none; border-radius:999px; padding:7px 14px; font-weight:700; font-size:12px}
#btnConnect.linked{background:rgba(255,255,255,.14); font-size:11px}
/* continuous 40–100% HRR bar: fixed-range fill + zone-width segments doubling as boundary ticks */
#hrBar{position:relative; margin-top:6px; height:8px; border-radius:4px; overflow:hidden; background:rgba(255,255,255,.08)}
#hrBarSegs{display:flex; height:100%; position:relative; z-index:1}
#hrBarSegs span{flex:0 0 16.6667%; height:100%; border-right:1px solid rgba(255,255,255,.35); background:rgba(255,255,255,.06)}
#hrBarSegs span:first-child{flex-basis:33.3333%}
#hrBarSegs span:last-child{border-right:none}
#hrBarSegs span.cur{background:rgba(255,255,255,.18)}
#hrBarFill{position:absolute; top:0; left:0; height:100%; width:0%; background:rgba(255,255,255,.85); border-radius:4px; transition:width .3s ease; z-index:2}

.selects{display:flex; gap:8px; padding:10px 14px; background:var(--surface)}
select{flex:1; background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:9px 10px; font-size:15px}
.tabs{display:flex; gap:6px; padding:0 14px 10px; background:var(--surface); border-bottom:1px solid var(--line)}
.tab{flex:1; padding:8px; text-align:center; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--muted); font-size:14px; font-weight:600}
.tab.active{background:var(--amber); color:#0E1526; border-color:var(--amber)}
main{padding:12px 14px}
.meta{background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--green); border-radius:8px; padding:10px 12px; font-size:13px; color:var(--muted); margin-bottom:8px}
.meta b{color:var(--green); font-weight:600}
.meta.eq{border-left-color:var(--blue)} .meta.eq b{color:var(--blue)}
.meta.px{border-left-color:var(--z4)} .meta.px b{color:var(--z4)}
.meta.warn{border-left-color:var(--amber)} .meta.warn b{color:var(--amber)}
.block{background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:14px; overflow:hidden; transition:border-color .3s}
.block.live{border-color:var(--amber); box-shadow:0 0 0 1px var(--amber)}
.block.finished{border-color:var(--green)}
.block-h{display:flex; justify-content:space-between; align-items:center; padding:10px 12px; background:linear-gradient(90deg,#1B2A4A,#22345C); gap:8px}
.block-h .t{font-family:var(--disp); font-weight:700; font-size:17px; letter-spacing:.05em; text-transform:uppercase; flex:1}
.bells{font-family:var(--disp); font-weight:700; font-size:14px; color:var(--muted); white-space:nowrap}
.playb{width:52px; height:40px; border-radius:9px; border:none; background:var(--amber); color:#0E1526; font-size:18px; font-weight:800}
.playb.live{background:var(--red); color:#fff}
.playb.done{background:var(--green)}
.ex{padding:10px 12px; border-top:1px solid var(--line)}
.ex-name{font-weight:700; font-size:15px}
.ex-rx{color:var(--muted); font-size:13px; margin:2px 0 8px}
.ex-note{color:var(--muted); font-size:12px; font-style:italic; margin:-4px 0 8px}
.ex-name-input{font-weight:700; font-size:15px; background:var(--surface); border:1px solid var(--line); border-radius:7px; color:var(--text); padding:8px 10px; font-family:var(--body); width:100%}
.sets{display:flex; flex-direction:column; gap:6px}
.set{display:flex; align-items:center; gap:8px}
.set .n{font-family:var(--disp); font-weight:700; color:var(--muted); width:20px; font-size:15px}
.set.now .n{color:var(--amber)}
.set input{width:80px; background:var(--surface); border:1px solid var(--line); border-radius:7px; color:var(--text); font-family:var(--mono); font-size:15px; padding:8px; text-align:center}
.set input:focus{outline:none; border-color:var(--amber)}
.set .x{color:var(--muted)}
.notecard{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:14px}
.notecard label{font-size:13px; color:var(--muted); display:block; margin-bottom:6px}
.notecard textarea{width:100%; background:var(--surface); border:1px solid var(--line); border-radius:8px; color:var(--text); padding:9px; font-size:15px; font-family:var(--body)}
.notecard input[type=number]{background:var(--surface); border:1px solid var(--line); border-radius:8px; color:var(--text); padding:9px; font-size:15px; width:90px; text-align:center; font-family:var(--mono)}
.notecard select{padding:9px 10px}
.hep-blk-label{cursor:pointer; display:flex; align-items:center; justify-content:space-between}
.hep-blk-ind{display:inline-block; transition:transform .15s ease}
.notecard.collapsed .hep-blk-ind{transform:rotate(-90deg)}
.notecard.collapsed .hep-blk-body{display:none}
.formref-label{cursor:pointer; display:flex; align-items:center; justify-content:space-between}
.formref-ind{display:inline-block; transition:transform .15s ease}
.notecard.collapsed .formref-ind{transform:rotate(-90deg)}
.notecard.collapsed .formref-body{display:none}
.formref-ex{border-top:1px solid var(--line); padding:2px 0}
.formref-ex-name{cursor:pointer; display:flex; align-items:center; justify-content:space-between; font-weight:700; font-size:14px; padding:8px 0}
.formref-ex-ind{display:inline-block; transition:transform .15s ease}
.formref-ex.collapsed .formref-ex-ind{transform:rotate(-90deg)}
.formref-ex.collapsed .formref-ex-body{display:none}
.formref-ex-body{padding-bottom:8px}
.formref-status{color:var(--muted); font-size:12px; font-style:italic; margin-bottom:6px}
.formref-section{margin:8px 0}
.formref-section-t{font-weight:700; font-size:13px; margin-bottom:2px}
.formref-section ul,.formref-section ol{margin:0; padding-left:20px; font-size:13px; color:var(--muted)}
.formref-section li{margin-bottom:3px}
.rpe-row{display:flex; gap:6px; margin-top:6px}
.rpe{flex:1; padding:9px 0; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--muted); font-weight:700}
.rpe.on{background:var(--amber); color:#0E1526; border-color:var(--amber)}
.savebtn{width:100%; padding:14px; border-radius:10px; border:none; background:var(--green); color:#0E1526; font-size:17px; font-weight:800; font-family:var(--disp); letter-spacing:.06em; text-transform:uppercase}
.restbtn{width:100%; padding:12px; margin-top:8px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--muted); font-size:15px; font-weight:700; font-family:var(--disp); letter-spacing:.06em; text-transform:uppercase}
.btn2{padding:10px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); font-weight:600; font-size:14px}
.btn2.acc{background:var(--blue); border-color:var(--blue); color:#fff}
.dock{position:fixed; bottom:0; left:0; right:0; z-index:30; background:#101A31; border-top:2px solid var(--line); padding:10px 14px 16px}
.dock-idle{color:var(--muted); font-size:13px; padding:8px 0; display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:10px; text-align:center}
.dock-run{display:flex; align-items:center; gap:14px}
.ivt-launch{padding:7px 10px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--text); font-size:12px; font-weight:700; white-space:nowrap; font-family:var(--mono); flex-shrink:0}
.ivt-launch.live{border-color:var(--green); color:var(--green)}
.d-block{font-family:var(--disp); font-weight:700; font-size:30px; color:var(--amber); background:rgba(245,166,35,.12); border:1px solid rgba(245,166,35,.4); border-radius:10px; padding:4px 14px}
.d-mid{flex:1}
.d-set{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.1em}
.d-time{font-family:var(--disp); font-weight:700; font-size:52px; line-height:1; font-variant-numeric:tabular-nums; color:var(--text)}
.d-time.warn{color:var(--amber)}
.d-stop{width:52px; height:52px; border-radius:10px; border:1px solid var(--red); background:transparent; color:var(--red); font-size:20px; font-weight:800}
.ivt-overlay{position:fixed; inset:0; z-index:60; background:rgba(6,10,20,.75); display:flex; align-items:center; justify-content:center; padding:16px}
.ivt-modal{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; width:100%; max-width:360px; max-height:88vh; overflow-y:auto}
.ivt-h{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px}
.ivt-h .t{font-family:var(--disp); font-weight:700; font-size:18px; letter-spacing:.05em; text-transform:uppercase}
.ivt-close{width:36px; height:36px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--muted); font-size:16px; font-weight:800; flex-shrink:0}
.ivt-modal .fieldrow input[type=number]{background:var(--surface); border:1px solid var(--line); border-radius:8px; color:var(--text); padding:9px; font-size:15px; width:90px; text-align:center; font-family:var(--mono)}
.ivt-row{display:flex; gap:10px; align-items:center; margin-top:8px}
.ivt-mute-btn{width:44px; height:44px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--text); font-size:18px; flex:0 0 44px}
.ivt-mute-btn.on{border-color:var(--amber); color:var(--amber)}
.ivt-phase{border-radius:12px; padding:22px 12px; text-align:center; margin:10px 0 4px; transition:background-color .3s ease, border-color .3s ease, opacity .3s ease}
.ivt-phase.idle{background:var(--surface); border:1px solid var(--line)}
.ivt-phase.work{background:rgba(52,199,123,.14); border:1px solid var(--green)}
.ivt-phase.rest{background:rgba(92,168,255,.14); border:1px solid var(--blue)}
.ivt-phase.paused{opacity:.55}
.ivt-phase .lbl{font-family:var(--disp); font-weight:700; font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
.ivt-phase.work .lbl{color:var(--green)}
.ivt-phase.rest .lbl{color:var(--blue)}
.ivt-phase .time{font-family:var(--disp); font-weight:700; font-size:58px; line-height:1; font-variant-numeric:tabular-nums; margin:4px 0}
.ivt-phase .rd{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em}
.hist-card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px}
.hist-card .h{display:flex; justify-content:space-between; align-items:center; font-weight:700; margin-bottom:4px; gap:8px}
.hist-card .sub{color:var(--muted); font-size:13px}
.pxi-pill{font-family:var(--disp); font-weight:700; font-size:15px; color:var(--z4); white-space:nowrap}
.medal-pill{display:inline-block; padding:2px 8px; border-radius:999px; font-size:10px; font-weight:800; letter-spacing:.08em; background:var(--surface); border:1px solid var(--line)}
.note-ic{color:var(--muted); vertical-align:middle; flex-shrink:0}
.note-full{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-top:8px; font-size:13px; white-space:pre-wrap}
.pr-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px}
.pr{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px}
.pr .l{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
.pr .v{font-family:var(--disp); font-weight:700; font-size:26px; color:var(--amber)}
.row2{display:flex; gap:8px; margin-top:6px}
.row2 button{flex:1; padding:10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); font-weight:600}
.toast{position:fixed; top:64px; left:50%; transform:translateX(-50%); background:var(--green); color:#0E1526; font-weight:700; padding:10px 18px; border-radius:20px; z-index:50; opacity:0; transition:opacity .25s; pointer-events:none}
.toast.show{opacity:1}
.warnbar{background:rgba(224,91,91,.12); border:1px solid var(--red); color:#F0B3B3; border-radius:8px; padding:8px 12px; font-size:13px; margin-bottom:10px}
.howto{background:var(--surface); border:1px dashed var(--line); border-radius:8px; padding:10px 12px; font-size:13px; color:var(--muted); margin-bottom:10px}
.howto b{color:var(--amber)}
.bigscore{text-align:center; padding:14px 0 6px}
.bigscore .v{font-family:var(--disp); font-weight:700; font-size:64px; line-height:1; color:var(--z4)}
.bigscore .sub{color:var(--muted); font-size:13px; margin-top:4px}
.bigscore .medal{font-family:var(--disp); font-weight:700; font-size:16px; letter-spacing:.12em; text-transform:uppercase; margin-top:6px}
.zGrid{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin:10px 0}
.zGrid label{display:flex; flex-direction:column; gap:5px; font-size:10px; text-transform:uppercase; letter-spacing:.06em; text-align:center; color:var(--muted)}
.zGrid input{width:100%; background:var(--surface); border:1px solid var(--line); border-radius:7px; color:var(--text); font-family:var(--mono); font-size:15px; padding:8px; text-align:center}
.zDot{width:100%; height:5px; border-radius:3px}
.fieldrow{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:7px 0}
.fieldrow span{font-size:14px}
/* zone compliance rows (Tue/Thu Z2 + Sat class) */
.zc-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line)}
.zc-row:last-child{border-bottom:none}
.zc-row .zl{width:74px; font-family:var(--disp); font-weight:700; font-size:14px}
.zc-row .zr{flex:1; color:var(--muted); font-size:12px}
.zc-row .zv{font-family:var(--disp); font-weight:700; font-size:20px; font-variant-numeric:tabular-nums; min-width:64px; text-align:right}
.zc-row.ok .zv{color:var(--green)} .zc-row.warn .zv{color:var(--amber)} .zc-row.bad .zv{color:var(--red)}
@media(min-width:700px){ main{max-width:640px; margin:0 auto} .dock{max-width:640px; margin:0 auto; left:50%; transform:translateX(-50%); border-radius:14px 14px 0 0} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="topbar">
  <h1 id="title">8-Week Block</h1>
  <div class="clock paused" id="clock">0:00</div>
</div>

<div id="hrband">
  <div class="hb-row">
    <div class="hb-stat"><div class="v" id="bpmV">--</div><div class="l">BPM</div></div>
    <div class="hb-stat"><div class="v" id="pctV">--</div><div class="l">%Max</div></div>
    <div class="hb-stat"><div class="v" id="pxiV" style="color:var(--z4)">0</div><div class="l">RKD</div></div>
    <div class="hb-zone" id="zoneName">HR not connected</div>
    <button id="btnConnect" onclick="connectWhoop()">Link WHOOP</button>
  </div>
  <div id="hrBar"><div id="hrBarSegs"><span></span><span></span><span></span><span></span><span></span></div><div id="hrBarFill"></div></div>
</div>

<div class="selects">
  <select id="weekSel" onchange="stopBlock();render()"></select>
  <!-- Groups are ordered current-block-first by orderDaySel() at init, so the block you're
       actually training is at the top of the list on mobile. Tue/Thu/Sat/Sun are shared by
       every block (not legacy), so they sit in their own group right below rather than being
       buried at the bottom. Each block group carries its date range in the label. -->
  <select id="daySel" onchange="stopBlock();render()">
    <optgroup id="ogMeso02" label="Mesocycle 02 · 9/7–10/18">
      <option value="meso02Mon">Mon · Lower/Hinge</option>
      <option value="meso02Wed">Wed · Upper Push</option>
      <option value="meso02Fri">Fri · Pull + Accessory</option>
    </optgroup>
    <optgroup label="Every week">
      <option value="tue">Tue · Zone 2 / Rest</option>
      <option value="thu">Thu · Zone 2 / Rest</option>
      <option value="sat">Sat · Conditioning</option>
      <option value="sun" id="optSun">Sun · CS4 Recovery</option>
    </optgroup>
    <optgroup label="Override (any day)">
      <option value="strengthFree">Strength · Freeform</option>
    </optgroup>
    <optgroup id="ogMeso01" label="Mesocycle 01 · 8/17–9/6">
      <option value="fullBodyA">Full Body A · Hinge</option>
      <option value="fullBodyB">Full Body B · Squat</option>
      <option value="fullBodyC">Full Body C · Push</option>
    </optgroup>
    <optgroup id="ogLegacy" label="Block 1 · 7/6–8/16">
      <option value="upper">Mon · Row/Press</option>
      <option value="lower">Wed · Deadlift</option>
      <option value="mixed">Fri · Split Squat</option>
    </optgroup>
  </select>
</div>
<div class="tabs">
  <button class="tab active" id="tabS" onclick="setView('session')">Session</button>
  <button class="tab" id="tabP" onclick="setView('pxi')">RKD</button>
  <button class="tab" id="tabH" onclick="setView('history')">History</button>
  <button class="tab" id="tabHep" onclick="setView('hep')">HEP</button>
</div>
<main id="main"></main>
<div class="dock" id="dock"><div class="dock-idle">Reach your equipment → press ▶ on that block. Bell = start your set. Rest until the next bell.<button class="ivt-launch" id="ivtDockBtn" onclick="openIvt()" title="Interval timer">⏱</button></div></div>
<div class="toast" id="toast"></div>
<div class="ivt-overlay" id="ivtOverlay" style="display:none"><div class="ivt-modal" id="ivtModal"></div></div>

<script>
/* ================= PROGRAM DATA ================= */
// DORMANT — bench loading progression, retained for post-clearance
// reintroduction (OT reassessment Aug 11). Do not delete.
const BENCH=[[3,10,"120 lb",12],[4,8,"130 lb",13],[4,8,"135 lb",13],[4,6,"145 lb",13],[5,5,"150 lb",14],[4,3,"160 lb",15],[5,2,"170 lb",17],["Ramp","1","185–195 test",16]];
// DORMANT — SA DB Row / Chest-Supported Row progression, retired from the
// old Monday "Row" slot when Monday's pool moved to Neutral-Grip DB Row
// (ROW) + DB Shoulder Press + Box Jump/Step-Up/Pallof/Sled Push. Retained
// in case the rehab-row progression is needed again. Do not delete.
const PULL=[[4,6,"BW"],[4,6,"BW +2s lower"],[4,5,"+10 lb"],[4,5,"+15 lb"],[4,4,"+20 lb"],[4,3,"+25 lb"],[4,3,"+30 lb"],["Ramp","1–3","+35–45 test"]];
const DL=[[3,8,"220 lb",13],[3,8,"235 lb",13],[4,6,"250 lb",14],[4,5,"260 lb",14],[5,4,"270 lb",15],[4,3,"285 lb",15],[3,2,"305 lb",16],["Ramp","1","335–350 test",16]];
// DORMANT — Leg Press progression, retired from the old Wednesday "Leg
// Press" slot when Wednesday's pool moved to flat-prescription Goblet
// Squat. Retained in case Leg Press returns as the primary lower load.
// Do not delete.
const SQ=[[3,8,"185 lb",10],[3,8,"195 lb",10],[4,6,"205 lb",10],[4,6,"215 lb",10],[4,5,"225 lb",10],[3,4,"235 lb",9],[3,3,"245 lb",9],[2,3,"205 deload",6]];
const OHP=w=>w<=2?[3,10,"75 lb"]:w<=5?[4,8,"85 lb"]:w<=7?[4,5,"100 lb"]:[2,5,"85 lb"];

/* ================= BLOCK / WEEK IDENTITY =================
   Single source of truth for "which training block does a date belong to, and which week of
   that block is it" — same calendar day-offset math as inMeso01Window()/inMeso02Window().
   Deliberately NOT weekSel: that dropdown numbers the OLD 8-week program (start Mon Jul 6
   2026, clamped by Math.min(8,...)), so it stopped advancing on Mon Aug 24 and tags every
   session after that — across Meso01 and Meso02, two unrelated blocks — as "week 8".

   it is just no longer the source of truth for the displayed label or for log grouping.
   The three windows tile with no gap: Jul 6–Aug 16, Aug 17–Sep 6, Sep 7–Oct 18. */
const LEGACY_START=new Date(2026,6,6); // Mon Jul 6, 2026 — the original 8-week block
const LEGACY_END_DAY=41;               // Sun Aug 16 — Meso01 supersedes it the next day

 {id:"legacy",label:"Block 1",start:LEGACY_START,lastDay:LEGACY_END_DAY},

function blockFor(when){
  const t=(when?new Date(when):new Date()).getTime();
  for(let i=BLOCKS.length-1;i>=0;i--){ /* newest first — a later block wins any overlap */
    const b=BLOCKS[i], off=Math.floor((t-b.start)/864e5);
    if(off>=0&&off<=b.lastDay) return {id:b.id,label:b.label,week:Math.floor(off/7)+1};
  }
  /* FALLBACK for dates no block covers — FLAGGED FOR CONFIRMATION. Past the end of the last
     defined block we keep counting weeks ("Off-block · Wk 1, 2, …") so totals keep advancing
     and unrelated weeks never merge into one bucket — i.e. the exact failure being fixed here
     does not just reappear after Oct 18. Anything before Block 1 began is "Pre-block". */
  const last=BLOCKS[BLOCKS.length-1];
  const past=Math.floor((t-last.start)/864e5)-last.lastDay;
  return past>0?{id:"open",label:"Off-block",week:Math.ceil(past/7)}
               :{id:"pre", label:"Pre-block",week:1};
}

  formRefKeys.forEach((key,i)=>{

    s.blocks.some(b=>b.ex.some(ex=>{ if(ex.key===key){ dispName=ex.n; return true; } return false; }));

/* ================= RKD ENGINE ================= */
/* Strength curve per program sheet: Z0≈1 · Z1≈2 · Z2≈4 (peak) · Z3≈3 · Z4≈1.5 · Z5≈0.8 pts/min */
const PTS={ cardio:[0,1,2,3,4,5], strength:[1,2,4,3,1.5,0.8], summit:[0,1,2,3,4.35,5] };
const MODEL_DESC={
  cardio:"Straight ramp: 1–5 pts/min from Z1 to Z5.",
  strength:"Inverted-U per your sheet: Z0 1 · Z1 2 · Z2 4 (peak) · Z3 3 · Z4 1.5 · Z5 0.8 pts/min. Score by lifting, not redlining.",
  summit:"Cardio family with a Z4 boost (~4.35 pts/min at 80–89%)."};
const ZONE_NAMES=["Below zones","Zone 1 · 40–59% HRR","Zone 2 · 60–69% HRR","Zone 3 · 70–79% HRR","Zone 4 · 80–89% HRR","Zone 5 · 90%+ HRR"];
function zoneOf(pct){ if(pct>=90)return 5; if(pct>=80)return 4; if(pct>=70)return 3; if(pct>=60)return 2; if(pct>=40)return 1; return 0; }
/* %HRR (Karvonen) — matches WHOOP zone boundaries exactly (RHR 46 / max 185 → Z2 = 130–143 bpm) */
function hrPct(bpm){ const r=pxiSet.restingHr||46, m=pxiSet.maxHr||185; return Math.round((bpm-r)/Math.max(1,m-r)*100); }
function zoneOfBpm(bpm){ const r=pxiSet.restingHr||46, H=Math.max(1,(pxiSet.maxHr||185)-r);
  const b=f=>Math.floor(r+f*H)+1;
  if(bpm>=b(.9))return 5; if(bpm>=b(.8))return 4; if(bpm>=b(.7))return 3; if(bpm>=b(.6))return 2; if(bpm>=Math.floor(r+.4*H))return 1; return 0; }
function scoreZones(mins,model){ const p=PTS[model]||PTS.cardio; return mins.reduce((s,m,i)=>s+m*p[i],0); }
function medalFor(pxi,target){
  if(!target) return null;
  const dev=Math.abs(pxi-target)/target*100;
  if(dev<=5) return {t:"GOLD",c:"var(--gold)"};
  if(dev<=10) return {t:"SILVER",c:"var(--silver)"};
  if(dev<=15) return {t:"BRONZE",c:"var(--bronze)"};
  return {t:"OFF TARGET",c:"var(--muted)"};
}
/* Tue/Thu medal: same tiered-deviation logic as medalFor(), reused against a different metric —
   % of session time spent in Z2 (target 100%) instead of points-vs-target. Z2 is still the zone
   the 25–35 min compliance card (complianceRows/updateCompliance, unchanged) is grading you on;
   this just gives that same emphasis a live-scored medal like lift days get. */
function pctZ2(mins){ const total=mins.reduce((a,b)=>a+(b||0),0); return total>0?Math.round((mins[2]||0)/total*100):0; }
function zone2MedalFor(mins){ return medalFor(pctZ2(mins),100); }
const LIFT_DAYS=["upper","lower","mixed","fullBodyA","fullBodyB","fullBodyC","meso02Mon","meso02Wed","meso02Fri"];

   variants, the w<8 finisher. Every mesocycle day is calendar-driven and ignores w. */

/* weekSel is Block 1's week picker and nothing else, so it only makes sense on a legacy day.
   Hidden elsewhere: it can't be mistaken for the current block's week, and daySel gets the
   full row. Value survives hiding, so legacy templates still resolve normally. */

/* ================= LIVE HR (WHOOP broadcast via Web Bluetooth) ================= */
let hrDevice=null, live={zoneSecs:[0,0,0,0,0,0], pxi:0, lastBpm:null, secs:0, tick:null};
function hrListener(e){
  const dv=e.target.value; const flags=dv.getUint8(0);
  live.lastBpm=(flags&0x1)?dv.getUint16(1,true):dv.getUint8(1);
}
async function connectWhoop(){
  if(!navigator.bluetooth){ toast("No Web Bluetooth here — open this file in Bluefy"); return; }
  try{
    hrDevice=await navigator.bluetooth.requestDevice({filters:[{services:["heart_rate"]}]});
    hrDevice.addEventListener("gattserverdisconnected",onHrDisconnect);
    await subscribeHr();
    startClock(); keepAwake();
    toast("WHOOP linked — tracking zones");
  }catch(err){ if(String(err).indexOf("cancel")<0) toast("Connection failed — check WHOOP broadcast is on"); }
}
async function subscribeHr(){
  const server=await hrDevice.gatt.connect();
  const svc=await server.getPrimaryService("heart_rate");
  const ch=await svc.getCharacteristic("heart_rate_measurement");
  await ch.startNotifications();
  ch.addEventListener("characteristicvaluechanged",hrListener);
  if(!live.tick) live.tick=setInterval(liveSecond,1000);
  const b=document.getElementById("btnConnect");
  b.textContent="WHOOP ✓"; b.classList.add("linked");
}
function onHrDisconnect(){
  clearInterval(live.tick); live.tick=null; live.lastBpm=null;
  const b=document.getElementById("btnConnect");
  b.textContent="Reconnect"; b.classList.remove("linked");
  setBand(0,"Disconnected — data so far is kept",null,null);
  toast("WHOOP disconnected");
  setTimeout(async()=>{ try{ if(hrDevice&&!hrDevice.gatt.connected){ await subscribeHr(); toast("Reconnected"); } }catch(e){} },3000);
}
function liveSecond(){
  if(live.lastBpm==null) return;
  const pct=hrPct(live.lastBpm);
  const z=zoneOfBpm(live.lastBpm);
  live.zoneSecs[z]+=1; live.secs+=1;
  /* Tue/Thu now scores on the same curve as lift days — curModel() already returns "strength"
     for any non-Sat day, so no special case needed here. Medal (below) is still zone2-specific:
     % of session time in Z2 vs. a strength-day points target. */
  live.pxi+=(PTS[curModel()]||PTS.cardio)[z]/60;
  setBand(z,ZONE_NAMES[z],live.lastBpm,pct);
  if(view==="pxi") renderLiveScore();
  updateCompliance();
}
function setBand(z,label,bpm,pct){
  const band=document.getElementById("hrband");
  band.className=z>0?"z"+z:"";
  document.getElementById("zoneName").textContent=label;
  document.getElementById("bpmV").textContent=bpm!=null?bpm:"--";
  document.getElementById("pctV").textContent=pct!=null?pct:"--";
  document.getElementById("pxiV").textContent=Math.round(live.pxi);
  const fillPct=pct!=null?Math.max(0,Math.min(100,(pct-40)/60*100)):0;
  document.getElementById("hrBarFill").style.width=fillPct+"%";
  document.querySelectorAll("#hrBarSegs span").forEach((s,i)=>s.classList.toggle("cur",z>0&&(i+1)===z));
}

/* Zone-minute compliance (Tue/Thu Z2 + Sat class) — sheet: 25–35 min Z2, ≤5 min Z3, 0 min Z4/Z5 */
function complianceRows(dayType){
  const m=live.zoneSecs.map(s=>s/60);
  const hi=m[4]+m[5];
  if(dayType==="zone2") return [
    {l:"Z2", r:"goal 25–35 min", v:m[2], cls:m[2]>=25&&m[2]<=35?"ok":(m[2]<25?"warn":"bad")},
    {l:"Z3", r:"cap 5 min", v:m[3], cls:m[3]<=5?"ok":"bad"},
    {l:"Z4–Z5", r:"zero — this must make Wednesday better, not worse", v:hi, cls:hi<0.5?"ok":"bad"}];
  /* class day */
  return [
    {l:"Z1–Z2", r:"where most of the class should live at 7/10", v:m[1]+m[2], cls:"ok"},
    {l:"Z3", r:"fine in doses", v:m[3], cls:m[3]<=10?"ok":"warn"},
    {l:"Z4–Z5", r:"class running hot — dial back", v:hi, cls:hi<2?"ok":(hi<5?"warn":"bad")}];
}
function updateCompliance(){
  const el=document.getElementById("zc"); if(!el)return;
  const rows=complianceRows(el.dataset.type);
  el.innerHTML=rows.map(r=>`<div class="zc-row ${r.cls}"><span class="zl">${r.l}</span><span class="zr">${r.r}</span><span class="zv">${r.v.toFixed(1)}m</span></div>`).join("");
}

/* ================= WAKE LOCK ================= */
// Reference-counted: the block timer and the standalone interval timer can both want the
// screen awake at once, independently started/stopped — a plain boolean let either one's
// stop steal the lock out from under the other.
let wakeLock=null, awakeWanters=0;
async function acquireLock(){
  if(wakeLock||!("wakeLock" in navigator))return;
  try{ wakeLock=await navigator.wakeLock.request("screen"); }catch(e){}
}
function keepAwake(){ awakeWanters++; acquireLock(); }
function releaseAwake(){ awakeWanters=Math.max(0,awakeWanters-1); if(awakeWanters===0&&wakeLock){wakeLock.release().catch(()=>{}); wakeLock=null;} }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&awakeWanters>0)acquireLock(); });

/* ================= INTERVAL TIMER (standalone — no session logging) =================
   Work/rest/rounds are user-set, not tied to any block/day. Never touches loadLogs/saveLogs
   or the session draft — it's a stopwatch utility, usable on any day including Tue/Thu at
   the pool. Ticks independently of the modal being open so it keeps running if closed. */
let ivtCfg=(()=>{ const d={work:30,rest:15,rounds:8,muted:false};
  if(!storageOK) return d;
  try{return Object.assign(d,JSON.parse(localStorage.getItem("dtp-ivt")||"{}"));}catch(e){return d;} })();
const saveIvtCfg=()=>{ if(storageOK) localStorage.setItem("dtp-ivt",JSON.stringify(ivtCfg)); };
let ivt=null; // {phase:"work"|"rest", round, end, int, paused, pausedLeft, done}
function openIvt(){ document.getElementById("ivtOverlay").style.display="flex"; renderIvt(); }
function closeIvt(){ document.getElementById("ivtOverlay").style.display="none"; }
function ivtApplyCfg(){
  ivtCfg.work=Math.max(1,+document.getElementById("ivtWork").value||30);
  ivtCfg.rest=Math.max(0,+document.getElementById("ivtRest").value||0);
  ivtCfg.rounds=Math.max(1,+document.getElementById("ivtRounds").value||1);
  saveIvtCfg();
}
function ivtToggleMute(){ ivtCfg.muted=!ivtCfg.muted; saveIvtCfg(); renderIvt(); }
function ivtStart(){
  ivtApplyCfg();
  if(ivt&&ivt.int) clearInterval(ivt.int);
  keepAwake();
  ivt={phase:"work", round:1, end:Date.now()+ivtCfg.work*1000, paused:false, done:false};
  ivtTone("work");
  ivt.int=setInterval(ivtTick,200);
  renderIvt();
}
function ivtTick(){
  if(!ivt||ivt.paused)return;
  if(Date.now()>=ivt.end){
    if(ivt.phase==="work"){
      if(ivt.round>=ivtCfg.rounds){ ivtFinish(); return; }
      if(ivtCfg.rest>0){ ivt.phase="rest"; ivt.end=Date.now()+ivtCfg.rest*1000; ivtTone("rest"); }
      else { ivt.round++; ivt.end=Date.now()+ivtCfg.work*1000; ivtTone("work"); }
    } else {
      ivt.round++; ivt.phase="work"; ivt.end=Date.now()+ivtCfg.work*1000; ivtTone("work");
    }
  }
  renderIvt();
}
function ivtPauseResume(){
  if(!ivt||ivt.done)return;
  if(ivt.paused){
    ivt.end=Date.now()+ivt.pausedLeft; ivt.paused=false;
    ivt.int=setInterval(ivtTick,200); keepAwake();
  } else {
    clearInterval(ivt.int); ivt.pausedLeft=Math.max(0,ivt.end-Date.now()); ivt.paused=true;
    releaseAwake();
  }
  renderIvt();
}
function ivtFinish(){
  clearInterval(ivt.int); ivt.done=true; ivt.phase="done";
  releaseAwake(); ivtChime();
  renderIvt();
}
function ivtReset(){
  if(ivt){ clearInterval(ivt.int); if(!ivt.paused&&!ivt.done) releaseAwake(); }
  ivt=null;
  renderIvt();
}
function ivtTone(phase){
  if(ivtCfg.muted)return;
  ac(); if(!AC)return;
  if(phase==="work"){ tone(880,0,.3,.5); if(navigator.vibrate)navigator.vibrate(150); }
  else { tone(440,0,.3,.45); if(navigator.vibrate)navigator.vibrate([100,80,100]); }
}
function ivtChime(){
  if(ivtCfg.muted)return;
  ac(); if(!AC)return;
  tone(660,0,.2,.45); tone(880,.2,.2,.45); tone(1100,.4,.4,.5);
  if(navigator.vibrate)navigator.vibrate([250,120,250]);
}
function ivtDockLabel(){
  if(!ivt)return "⏱";
  if(ivt.done)return "⏱ Done";
  const left=ivt.paused?Math.ceil(ivt.pausedLeft/1000):Math.max(0,Math.ceil((ivt.end-Date.now())/1000));
  return (ivt.phase==="work"?"W ":"R ")+fmt(left);
}
function ivtDockBtnHtml(){
  const active=ivt&&!ivt.done&&!ivt.paused;
  return `<button class="ivt-launch${active?" live":""}" id="ivtDockBtn" onclick="openIvt()" title="Interval timer">${ivtDockLabel()}</button>`;
}

  if(!ivt){
    h+=`<div class="fieldrow"><span>Work (sec)</span><input type="number" id="ivtWork" min="1" max="3600" value="${ivtCfg.work}"></div>`;
    h+=`<div class="fieldrow"><span>Rest (sec)</span><input type="number" id="ivtRest" min="0" max="3600" value="${ivtCfg.rest}"></div>`;
    h+=`<div class="fieldrow"><span>Rounds</span><input type="number" id="ivtRounds" min="1" max="99" value="${ivtCfg.rounds}"></div>`;
    h+=`<div class="ivt-row">
      <button class="ivt-mute-btn${ivtCfg.muted?" on":""}" onclick="ivtToggleMute()" title="${ivtCfg.muted?"Unmute":"Mute"}">${ivtCfg.muted?"🔇":"🔊"}</button>
      <button class="savebtn" style="flex:1" onclick="ivtStart()">Start</button>
    </div>`;
  } else if(ivt.done){
    h+=`<div class="ivt-phase idle"><div class="lbl">Complete</div><div class="time">✓</div><div class="rd">${ivtCfg.rounds} round${ivtCfg.rounds>1?"s":""} done</div></div>`;
    h+=`<div class="ivt-row">
      <button class="ivt-mute-btn${ivtCfg.muted?" on":""}" onclick="ivtToggleMute()" title="${ivtCfg.muted?"Unmute":"Mute"}">${ivtCfg.muted?"🔇":"🔊"}</button>
      <button class="savebtn" style="flex:1" onclick="ivtReset()">New timer</button>
    </div>`;
  } else {
    const left=ivt.paused?Math.ceil(ivt.pausedLeft/1000):Math.max(0,Math.ceil((ivt.end-Date.now())/1000));
    h+=`<div class="ivt-phase ${ivt.phase}${ivt.paused?" paused":""}">
      <div class="lbl">${ivt.paused?"Paused":(ivt.phase==="work"?"Work":"Rest")}</div>
      <div class="time">${fmt(left)}</div>
      <div class="rd">Round ${ivt.round} of ${ivtCfg.rounds}</div>
    </div>`;
    h+=`<div class="ivt-row">
      <button class="ivt-mute-btn${ivtCfg.muted?" on":""}" onclick="ivtToggleMute()" title="${ivtCfg.muted?"Unmute":"Mute"}">${ivtCfg.muted?"🔇":"🔊"}</button>
      <button class="btn2" style="flex:1" onclick="ivtPauseResume()">${ivt.paused?"Resume":"Pause"}</button>
      <button class="d-stop" onclick="ivtReset()">✕</button>
    </div>`;
  }
  el.innerHTML=h;
}

/* ================= SESSION CLOCK ================= */
let sessStart=null, sessAcc=0, sessInt=null;
function startClock(){ if(sessInt)return;
  sessStart=Date.now(); sessInt=setInterval(()=>{document.getElementById("clock").textContent=fmt(elapsedSec());},500);
  document.getElementById("clock").classList.remove("paused");}
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
function elapsedSec(){return Math.floor((sessAcc+(sessInt?Date.now()-sessStart:0))/1000);}

/* ================= BLOCK TIMER ================= */
let run=null;
function playBlock(bi){
  if(run&&run.bi===bi){stopBlock();return;}
  stopBlock();
  const w=+document.getElementById("weekSel").value, day=curDay();
  const b=getSession(w,day).blocks[bi];
  if(!b.bells)return;
  startClock(); keepAwake();
  run={bi, letter:b.letter, bells:b.bells, ivl:interval(b), setNo:1};
  run.end=Date.now()+run.ivl*1000;
  bell(); markLive(bi,true); updateDock();
  run.int=setInterval(tickBlock,200);
  highlightSet(bi,1);
}
function stopBlock(){ if(!run)return; clearInterval(run.int); markLive(run.bi,false); run=null;
  if(view==="session") document.getElementById("dock").innerHTML=`<div class="dock-idle">Reach your equipment → press ▶ on that block. Bell = start your set. Rest until the next bell.${ivtDockBtnHtml()}</div>`;}
function tickBlock(){
  const left=Math.ceil((run.end-Date.now())/1000);
  if(left<=0){
    if(run.setNo>=run.bells){ finishBlock(); return;}

let AC=null;
function tone(f,t,dur,vol){const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);
  o.frequency.value=f;g.gain.setValueAtTime(vol,AC.currentTime+t);g.gain.exponentialRampToValueAtTime(.01,AC.currentTime+t+dur);
  o.start(AC.currentTime+t);o.stop(AC.currentTime+t+dur+.01);}

/* ---- session draft: typed-but-unsaved inputs survive tab switches (DOM is rebuilt wholesale on every render) ---- */
let sessionDraft=null;
const draftKey=()=>document.getElementById("weekSel").value+"|"+curDay();
function captureSessionDraft(){
  const fields={};
  document.querySelectorAll('#main input[id^="w_"], #main input[id^="r_"]').forEach(el=>{ if(el.value!=="") fields[el.id]=el.value; });
  const strainEl=document.getElementById("strain"), noteEl=document.getElementById("note"), actEl=document.getElementById("z2act");
  sessionDraft={key:draftKey(), fields, rpe:curRPE,
    strain:strainEl?strainEl.value:"", note:noteEl?noteEl.value:"", activity:actEl?actEl.value:null};
}
function restoreSessionDraft(){
  if(!sessionDraft||sessionDraft.key!==draftKey()) return;
  Object.keys(sessionDraft.fields).forEach(id=>{ const el=document.getElementById(id); if(el) el.value=sessionDraft.fields[id]; });
  const strainEl=document.getElementById("strain"); if(strainEl&&sessionDraft.strain!=="") strainEl.value=sessionDraft.strain;
  const noteEl=document.getElementById("note"); if(noteEl&&sessionDraft.note) noteEl.value=sessionDraft.note;
  const actEl=document.getElementById("z2act"); if(actEl&&sessionDraft.activity!=null) actEl.value=sessionDraft.activity;
  if(sessionDraft.rpe) setRPE(sessionDraft.rpe); /* setRPE re-applies the .on button highlight, not just curRPE */

function setView(v){
  if(view==="session"&&v!=="session") captureSessionDraft();

  document.getElementById("tabP").className="tab"+(v==="pxi"?" active":"");
  document.getElementById("tabH").className="tab"+(v==="history"?" active":"");
  document.getElementById("tabHep").className="tab"+(v==="hep"?" active":"");render();}
function lastFor(key){
  const logs=loadLogs();
  for(let i=logs.length-1;i>=0;i--){const e=(logs[i].entries||[]).find(x=>x.key===key);
    if(e&&e.sets.some(s=>s.w||s.r))return e.sets;}
  return null;
}

function blockHtml(s,bi){

  b.ex.forEach((ex,ei)=>{
    h+=`<div class="ex">`;
    h+=ex.editableName
      ?`<div style="display:flex;gap:8px"><input class="ex-name-input" style="flex:1" placeholder="Exercise name" value="${escAttr(ex.n)}" oninput="updateFreeformName(${bi},${ei},this.value)"><button class="btn2" style="flex:0 0 auto" onclick="removeFreeformEx(${bi},${ei})">✕</button></div>`
      :`<div class="ex-name">${ex.n}</div>`;
    if(ex.rx)h+=`<div class="ex-rx">${ex.rx}</div>`;
    if(ex.note)h+=`<div class="ex-note">${ex.note}</div>`;
    if(ex.sets>0){

      h+=`<div class="sets">`;
      for(let i=0;i<ex.sets;i++){
        const pw=last&&last[i]?last[i].w:"", pr=last&&last[i]?last[i].r:"";

          <input inputmode="numeric" placeholder="${pr||'reps'}" id="r_${bi}_${ei}_${i}"></div>`;

    }
    h+=`</div>`;
  });
  return h+`</div>`;

/* ---- Freeform (strengthFree) section editing ---- */
function addFreeformEx(si){
  captureSessionDraft();
  freeformNames[si].push("");
  render();
}
function removeFreeformEx(si,ei){
  captureSessionDraft();
  // Exercise indices after the removed one shift down by one position once we splice —
  // remap their captured w_/r_ field ids to match, or restoreSessionDraft() re-applies
  // stale values to whichever exercise slides into the removed slot.
  const fields=sessionDraft.fields;
  const shifted={};
  Object.keys(fields).forEach(id=>{
    const m=id.match(/^([wr])_(\d+)_(\d+)_(\d+)$/);
    if(!m){ shifted[id]=fields[id]; return; }
    const bi=+m[2], exi=+m[3];
    if(bi!==si||exi<ei) shifted[id]=fields[id];
    else if(exi>ei) shifted[`${m[1]}_${bi}_${exi-1}_${m[4]}`]=fields[id];
    // exi===ei: dropped — belonged to the exercise being removed
  });
  sessionDraft.fields=shifted;
  freeformNames[si].splice(ei,1);
  render();
}

function saveSession(){
  const w=+document.getElementById("weekSel").value, day=curDay();
  const s=getSession(w,day); const entries=[];
  s.blocks.forEach((b,bi)=>b.ex.forEach((ex,ei)=>{
    if(ex.sets>0&&ex.n){const sets=[];
      for(let i=0;i<ex.sets;i++){sets.push({w:document.getElementById(`w_${bi}_${ei}_${i}`).value,r:document.getElementById(`r_${bi}_${ei}_${i}`).value});}
      entries.push({key:ex.key,name:ex.n,rx:ex.rx||"",sets});}}));

  let pxi=null, zoneMins=null, model=curModel(), medal=null;
  if(live.secs>0){ pxi=Math.round(live.pxi); zoneMins=live.zoneSecs.map(x=>Math.round(x/6)/10); }
  else if(pendingManual){ pxi=pendingManual.pxi; zoneMins=pendingManual.mins; model=pendingManual.model; }
  /* Tue/Thu: pxi is already the live strength-curve accrual from above — medal is graded
     separately, on % of session time in Z2 vs. a 100% target, not on pxi vs. pxiSet.target */
  if(s.type==="zone2"){
    const md=zoneMins?zone2MedalFor(zoneMins):null;
    medal=md?md.t:null;
  } else if(s.type==="recovery"){
    /* Sun: completion badge only, never a score */
    pxi=null; medal="Done ✓";
  } else if(pxi!=null&&LIFT_DAYS.includes(day)){
    /* medals otherwise only exist on lifting days — Sat is capped effort, reference only */
    const md=medalFor(pxi,pxiSet.target); medal=md?md.t:null;
  }
  const strainEl=document.getElementById("strain");
  const strain=strainEl&&strainEl.value!==""?Math.min(21,Math.max(0,Math.round(+strainEl.value*10)/10)):null;

     the label and weeklyTotals() grouping actually read now */
  const bk=blockFor();
  const entry={date:new Date().toISOString(),week:w,block:bk.id,blockLabel:bk.label,blockWeek:bk.week,
    day,name:s.name,type:s.type,entries,rpe:curRPE,
    note:document.getElementById("note").value,strain,duration:elapsedSec(),
    pxi,zoneMins,pxiModel:pxi!=null?model:null,medal,
    target:medal==null?null:(s.type==="zone2"?100:pxiSet.target)};
  const actEl=document.getElementById("z2act"); if(actEl)entry.activity=actEl.value;
  const logs=loadLogs(); logs.push(entry); saveLogs(logs);

  freeformNames=[[],[],[]];

  document.getElementById("setRestHr").addEventListener("change",e=>{pxiSet.restingHr=+e.target.value||46;savePxiSet();});
  document.getElementById("setTarget").addEventListener("change",e=>{pxiSet.target=+e.target.value||105;savePxiSet();renderLiveScore();});
  document.getElementById("setModel").addEventListener("change",e=>{pxiSet.model=e.target.value;savePxiSet();renderPxiPage(m);});
  renderLiveScore();
}
function manualScore(){
  const mins=[0]; for(let i=1;i<=5;i++)mins.push(+document.getElementById("mz"+i).value||0);
  let model=document.getElementById("manualModel").value; if(model==="auto")model=curModel();
  const pxi=Math.round(scoreZones(mins,model));
  const lift=LIFT_DAYS.includes(curDay()), zone2Day=curDay()==="tue"||curDay()==="thu";
  let md=null, tag="reference only";
  if(lift){ md=medalFor(pxi,pxiSet.target); tag=md?md.t+" · target "+pxiSet.target:tag; }
  else if(zone2Day){ const pz=pctZ2(mins); md=medalFor(pz,100); tag=md?md.t+" · "+pz+"% in Z2":tag; }
  pendingManual={pxi,mins,model};
  document.getElementById("manualOut").innerHTML=
    `<div style="font-family:var(--disp);font-weight:700;font-size:44px;color:var(--z4)">${pxi}</div>
     <div style="font-family:var(--disp);font-weight:700;letter-spacing:.1em;color:${md?md.c:"var(--muted)"}">${tag}</div>
     <div class="sub" style="color:var(--muted);font-size:12px;margin-top:6px">Attached — it saves with your next "Save session".</div>`;
}

/* ================= HISTORY / PRS ================= */
const e1rm=(w,r)=>w*(1+r/30);
const PR_KEYS={"Bench Press":"lb","Deadlift":"lb","Leg Press":"lb","Chest-Supported Row":"lb","DB Shoulder Press":"lb","DB Row":"lb","Back Squat":"lb","OHP":"lb","BB Row":"lb","Weighted Pull-Up":"+lb","Dead Hang":"sec","SKB RDL":"kg","Hip Thrust":"lb","Wall Push-Up Progression":"reps","Rope Triceps Pressdown":"lb","Bulgarian SS":"lb","Cable Pullover":"lb","Single-Arm DB Row":"lb","Neutral-Grip Cable Row":"lb","Romanian Deadlift (DB)":"lb","Rack Pull":"lb","Chest Press":"lb","Triceps Extension":"lb","Neutral-Grip Row":"lb"};
const DAY_LABEL={upper:"Mon",tue:"Tue",lower:"Wed",thu:"Thu",mixed:"Fri",sat:"Sat",sun:"Sun",strengthFree:"Freeform",fullBodyA:"FB-A",fullBodyB:"FB-B",fullBodyC:"FB-C",meso02Mon:"Mon",meso02Wed:"Wed",meso02Fri:"Fri"};
const escAttr=s=>String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
/* Keyed by block + week-within-block, so two unrelated blocks never share a bucket.
   Was keyed on l.week (weekSel), which pinned everything after Aug 24 into a single "8". */
function weeklyTotals(logs){
  const totals={};
  logs.forEach(l=>{
    if(l.day==="sat"||l.pxi==null)return;
    const b=blockOf(l), k=b.id+"|"+b.week;
    if(!totals[k]) totals[k]={label:blockText(b),ord:BLOCK_ORD[b.id]??0,week:b.week,sum:0};
    totals[k].sum+=l.pxi;
  });
  return totals;
}
function renderHistory(m){
  document.getElementById("title").textContent="History & PRs";
  const logs=loadLogs();
  const prs={};
  logs.forEach(l=>(l.entries||[]).forEach(e=>{
    if(!(e.key in PR_KEYS))return;
    e.sets.forEach(s=>{const w=parseFloat(s.w),r=parseFloat(s.r);
      if(e.key==="Dead Hang"){if(w&&(!prs[e.key]||w>prs[e.key].v))prs[e.key]={v:w};return;}
      if(e.key==="Weighted Pull-Up"){if(!isNaN(w)&&(!prs[e.key]||w>prs[e.key].v))prs[e.key]={v:w};return;}
      if(e.key==="Wall Push-Up Progression"){if(r&&(!prs[e.key]||r>prs[e.key].v))prs[e.key]={v:r};return;}
      if(w&&r){const est=e1rm(w,r);if(!prs[e.key]||est>prs[e.key].v)prs[e.key]={v:est,raw:w+"×"+r};}});
  }));
  let h=`<div class="pr-grid">`;
  Object.keys(PR_KEYS).forEach(k=>{const p=prs[k];
    h+=`<div class="pr"><div class="l">${k}${PR_KEYS[k]==="lb"?" · e1RM":""}${k==="Wall Push-Up Progression"?" · resets meaning per stage":""}</div><div class="v">${p?Math.round(p.v)+(PR_KEYS[k]==="sec"?"s":PR_KEYS[k]==="+lb"?" lb":PR_KEYS[k]==="kg"?" kg":PR_KEYS[k]==="reps"?" reps":""):"—"}</div>${p&&p.raw?`<div class="sub" style="font-size:12px;color:var(--muted)">${p.raw}</div>`:""}</div>`;});
  h+=`</div>`;
  const totals=weeklyTotals(logs);
  /* newest block first, then newest week within it — the old numeric sort can't order across blocks */
  const keys=Object.keys(totals).sort((a,b)=>totals[b].ord-totals[a].ord||totals[b].week-totals[a].week);
  if(keys.length){
    h+=`<div class="notecard"><label>Weekly RKD (Mon–Sun · Sat excluded)</label>`;
    keys.forEach(k=>{
      const t=totals[k];
      h+=`<div class="fieldrow"><span>${t.label}</span><span style="font-family:var(--disp);font-weight:700;font-size:18px;color:${t.sum<0?"var(--red)":"var(--text)"}">${t.sum}</span></div>`;
    });
    h+=`</div>`;
  }
  if(!logs.length)h+=`<div class="meta">No sessions logged yet. Your first save lands here — with PRs and RKD computed automatically.</div>`;
  logs.map((l,idx)=>({l,idx})).reverse().forEach(({l,idx})=>{
    const dt=new Date(l.date);
    const medalColor=l.medal==="GOLD"?"var(--gold)":l.medal==="SILVER"?"var(--silver)":l.medal==="BRONZE"?"var(--bronze)":(l.medal==="Rest ✓"||l.medal==="Done ✓")?"var(--green)":"var(--muted)";
    const dl=DAY_LABEL[l.day]||"";
    const strainPill=l.strain!=null?`<span class="pxi-pill" style="color:var(--z2)">Strain ${l.strain.toFixed(1)}</span>`:"";
    const noteIcon=l.note?`<svg class="note-ic" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" title="${escAttr(l.note)}" style="cursor:pointer" onclick="toggleNote(${idx})"><path d="M4 4h13l3 3v13H4z"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="12" y2="17"/></svg>`:"";
    h+=`<div class="hist-card"><div class="h"><span>${blockTag(blockOf(l))}${dl?" · "+dl:""} · ${l.name}</span>
      <span style="display:flex;align-items:center;gap:8px">${l.pxi!=null?`<span class="pxi-pill"${l.pxi<0?' style="color:var(--red)"':''}>RKD ${l.pxi}</span>`:""}${l.medal?`<span class="medal-pill" style="color:${medalColor}">${l.medal}</span>`:""}${strainPill}${noteIcon}<span style="font-weight:400;color:var(--muted);font-size:13px">${dt.toLocaleDateString(undefined,{month:"short",day:"numeric"})}</span></span></div>
    <div class="sub">${l.duration?fmt(l.duration)+" · ":""}${l.rpe?"RPE "+l.rpe:""}${l.activity?" · "+l.activity:""}${l.zoneMins?" · "+l.zoneMins.map((z,i)=>i>0&&z>=0.5?"Z"+i+" "+Math.round(z)+"m":null).filter(Boolean).join(" "):""}</div>
    ${l.note?`<div class="note-full" id="noteFull${idx}" style="display:none">${escAttr(l.note)}</div>`:""}
    <div class="row2"><button onclick="copySummary(${idx})">Copy summary</button></div></div>`;});
  h+=`<div class="row2"><button onclick="exportLogs()">Export JSON</button><button onclick="importLogs()">Import JSON</button></div>`;
  m.innerHTML=h;
}
function priorBestValue(logs,uptoIdx,key){
  let best=null;
  for(let i=0;i<uptoIdx;i++){
    (logs[i].entries||[]).forEach(e=>{
      if(e.key!==key)return;
      e.sets.forEach(s=>{const w=parseFloat(s.w),r=parseFloat(s.r);
        if(key==="Dead Hang"){if(w&&(best==null||w>best))best=w;return;}
        if(key==="Weighted Pull-Up"){if(!isNaN(w)&&(best==null||w>best))best=w;return;}
        if(key==="Wall Push-Up Progression"){if(r&&(best==null||r>best))best=r;return;}
        if(w&&r){const est=e1rm(w,r);if(best==null||est>best)best=est;}});
    });
  }
  return best;
}
function exerciseSummaryLine(logs,idx,e){
  const sets=e.sets.filter(s=>s.w||s.r);
  if(!sets.length)return `- ${e.name}: prescribed ${e.rx||"—"}\n  actual: no data`;
  let best=e.key in PR_KEYS?priorBestValue(logs,idx,e.key):null;
  const parts=sets.map(s=>{
    const w=parseFloat(s.w),r=parseFloat(s.r);
    let val=null;
    if(e.key==="Dead Hang")val=w||null;
    else if(e.key==="Weighted Pull-Up")val=!isNaN(w)?w:null;
    else if(e.key==="Wall Push-Up Progression")val=r||null;
    else if(w&&r)val=e1rm(w,r);
    let pr=false;
    if(e.key in PR_KEYS&&val!=null&&(best==null||val>best)){pr=true;best=val;}
    return `${s.w||""}×${s.r||""}`+(pr?" PR":"");
  });
  return `- ${e.name}: prescribed ${e.rx||"—"}\n  actual: ${parts.join(", ")}`;
}
function buildSummary(logs,idx){
  const l=logs[idx];
  const dt=new Date(l.date);
  const zm=l.zoneMins||[0,0,0,0,0,0];
  const zoneLine=`Z1 ${(zm[1]||0).toFixed(1)} · Z2 ${(zm[2]||0).toFixed(1)} · Z3 ${(zm[3]||0).toFixed(1)} · Z4 ${(zm[4]||0).toFixed(1)} · Z5 ${(zm[5]||0).toFixed(1)}`;
  const exLines=(l.entries&&l.entries.length)?l.entries.map(e=>exerciseSummaryLine(logs,idx,e)).join("\n"):"none logged";
  return `RKD SESSION SUMMARY
Date: ${dt.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"})}
Block: ${blockText(blockOf(l))}
Session: ${l.name}
RKD: ${l.pxi!=null?l.pxi:"not logged"} (${l.medal||"no medal"})
Zone minutes: ${zoneLine}
Strain: ${l.strain!=null?l.strain.toFixed(1):"not logged"}
Exercises:
${exLines}
Notes: ${l.note||"none"}`;
}
function copySummary(idx){
  const logs=loadLogs(); if(!logs[idx])return;
  const text=buildSummary(logs,idx);
  navigator.clipboard.writeText(text).then(()=>toast("Summary copied")).catch(()=>toast("Copy failed"));
}
function toggleNote(idx){
  const el=document.getElementById("noteFull"+idx);
  if(el) el.style.display=el.style.display==="none"?"block":"none";
}
function collectHep(){
  const hep={}, hepDetail={};
  if(storageOK){
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(!k) continue;
      if(k.indexOf("hep_")===0){ try{hep[k.slice(4)]=JSON.parse(localStorage.getItem(k));}catch(e){} }
      else if(k.indexOf("hepDetail_")===0){ try{hepDetail[k.slice(10)]=JSON.parse(localStorage.getItem(k));}catch(e){} }
    }
  } else {
    Object.keys(hepMem).forEach(k=>hep[k.slice(4)]=hepMem[k]);
    Object.keys(hepDetailMem).forEach(k=>hepDetail[k.slice(10)]=hepDetailMem[k]);
  }
  return {hep,hepDetail};
}
async function exportLogs(){
  const payload=JSON.stringify({logs:loadLogs(),...collectHep()},null,1);
  const filename="block-log-"+new Date().toISOString().slice(0,10)+".json";
  const blob=new Blob([payload],{type:"application/json"});

  if(navigator.share){
    try{
      const file=new File([blob],filename,{type:"application/json"});
      if(!navigator.canShare||navigator.canShare({files:[file]})){
        await navigator.share({files:[file],title:filename});
        return;
      }
    }catch(e){
      if(e&&e.name==="AbortError") return;
    }
  }

  try{
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download=filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    return;
  }catch(e){}

  try{
    const win=window.open("","_blank");
    if(win){
      const esc=payload.replace(/&/g,"&amp;").replace(/</g,"&lt;");
      win.document.write("<pre>"+esc+"</pre>");
      win.document.title=filename;
      return;
    }
  }catch(e){}
  toast("Export failed — please try a different browser");
}
function importLogs(){
  const inp=document.createElement("input");inp.type="file";inp.accept=".json";
  inp.onchange=e=>{const f=e.target.files[0];const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);
      // Intentional asymmetry: logs are REPLACED wholesale (pre-existing behavior),
      // hep_*/hepDetail_* keys are MERGED per-date — imported dates overwrite,
      // existing dates not present in the file survive. Do not "fix" to replace.
      if(Array.isArray(d)){saveLogs(d);toast("Imported "+d.length+" sessions");render();}
      else if(d&&Array.isArray(d.logs)){
        saveLogs(d.logs);
        if(d.hep) Object.keys(d.hep).forEach(date=>{
          const v=d.hep[date];
          if(!Array.isArray(v)) return;
          const arr=v.slice(0,5).map(Boolean);
          while(arr.length<5)arr.push(false);
          const k="hep_"+date; if(storageOK) localStorage.setItem(k,JSON.stringify(arr)); else hepMem[k]=arr;
        });
        if(d.hepDetail) Object.keys(d.hepDetail).forEach(date=>{
          const v=d.hepDetail[date];
          if(!v||typeof v!=="object"||Array.isArray(v)) return;
          const clean={};
          Object.keys(v).forEach(exKey=>{
            const a=v[exKey];
            if(!Array.isArray(a)) return;
            const nums=a.slice(0,3).map(Number).filter(n=>Number.isFinite(n)&&n>0);
            if(nums.length) clean[exKey]=nums;
          });
          const k="hepDetail_"+date; if(storageOK) localStorage.setItem(k,JSON.stringify(clean)); else hepDetailMem[k]=clean;
        });
        toast("Imported "+d.logs.length+" sessions"); render();
      }
    }catch(err){toast("Import failed");}};
    r.readAsText(f);};
  inp.click();
}

/* ================= INIT ================= */
const ws=document.getElementById("weekSel");
/* Labelled "Block 1 · Wk N" — these are the OLD 8-week program's weeks, not the current
   block's. Reuses LEGACY_START so the date isn't defined in two places. The clamp to 8 is
   kept deliberately: it just parks the picker on Block 1's last week as a default, and no
   longer drives any label or log field. */
for(let i=1;i<=8;i++){const o=document.createElement("option");o.value=i;
  o.textContent="Block 1 · Wk "+i;ws.appendChild(o);}
const now=new Date(), diff=Math.floor((now-LEGACY_START)/(7*864e5));
ws.value=Math.min(8,Math.max(1,diff+1));
const daySel=document.getElementById("daySel");
/* Float the block being trained today to the top of the list. Replaces the old
   " (inactive)" suffixes: the dated group labels say which block a day belongs to, and the
   current one sorting first says which is live — without widening any option text. */
function orderDaySel(){
  const og=document.getElementById({legacy:"ogLegacy",meso01:"ogMeso01",meso02:"ogMeso02"}[blockFor().id]||"");
  if(og) daySel.insertBefore(og,daySel.firstChild);
}
orderDaySel();
/* Sun is yoga only inside Meso01 — same condition getSession()/render() branch on */
document.getElementById("optSun").textContent=inMeso01Window()?"Sun · Gentle Yoga":"Sun · CS4 Recovery";
daySel.value=["sun","upper","tue","lower","thu","mixed","sat"][now.getDay()];
const mesoDefaultDay=inMeso01Window()?{1:"fullBodyA",3:"fullBodyB",5:"fullBodyC"}[now.getDay()]
                    :inMeso02Window()?{1:"meso02Mon",3:"meso02Wed",5:"meso02Fri"}[now.getDay()]:null;
if(mesoDefaultDay) daySel.value=mesoDefaultDay;
render();
</script>
